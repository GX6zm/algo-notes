<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>点分治 · 图文讲义与动画演示</title>
<style>
  :root{
    --bg:#0d1421; --panel:#151f31; --line:#2a3853; --text:#e9f0fb;
    --muted:#93a4bf; --dim:#5f7190; --accent:#5b8cff; --orange:#ff8a3d;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
      radial-gradient(900px 500px at 15% -10%,rgba(91,140,255,.18),transparent 60%),
      radial-gradient(700px 420px at 90% 10%,rgba(255,138,61,.12),transparent 60%),
      var(--bg);
    color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:32px 20px}
  .box{width:100%;max-width:760px}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:2px;
    color:var(--accent);background:rgba(91,140,255,.14);padding:5px 12px;border-radius:20px}
  h1{font-size:clamp(30px,5vw,44px);margin:14px 0 6px;letter-spacing:2px;line-height:1.2}
  h1 span{color:var(--orange)}
  .sub{color:var(--muted);font-size:14px;line-height:1.9;margin:0 0 26px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;
    transition:transform .2s,border-color .2s,box-shadow .2s}
  a.card:hover{transform:translateY(-3px);border-color:var(--accent);
    box-shadow:0 16px 40px rgba(0,0,0,.35)}
  .k{font-size:11px;letter-spacing:1.5px;color:var(--dim);font-weight:700}
  .t{font-size:19px;font-weight:700;margin:6px 0 6px}
  .d{font-size:12.5px;color:var(--muted);line-height:1.7}
  .go{margin-top:14px;font-size:12.5px;color:var(--accent);font-weight:700}
  .card.pdf .go{color:var(--orange)}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:12px;color:var(--dim)}
  .foot a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--dim)}
  .foot a:hover{color:var(--accent)}
  @media(max-width:620px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="box">
    <span class="tag">ALGO NOTES · CENTROID DECOMPOSITION</span>
    <h1>点分治<span>·</span>图文讲义与动画</h1>
    <p class="sub">把一棵大树，拆成一堆小问题。<br>
      8 页图文讲义讲清思路，131 步交互动画演示真实计算过程 —— 同一棵示例树，数字完全对得上。</p>

    <div class="cards">
      <a class="card" href="./点分治动画演示.html">
        <div class="k">INTERACTIVE</div>
        <div class="t">动画演示</div>
        <div class="d">找重心 → 数路径 → 容斥去重 → 递归，可播放、单步、调速，切换 K 与示例树。</div>
        <div class="go">打开动画 →</div>
      </a>
      <a class="card pdf" href="./点分治讲义.pdf">
        <div class="k">PDF · 8 PAGES</div>
        <div class="t">图文讲义</div>
        <div class="d">问题引入、树的重心、三步走、双指针与容斥、C++ 模板、复杂度与易错点。</div>
        <div class="go">阅读 PDF →</div>
      </a>
    </div>

    <div class="foot">
      <span>源文件：<a href="./点分治讲义.html">讲义 HTML</a> · <a href="./build_pdf.py">build_pdf.py</a></span>
      <span><a href="https://github.com/GX6zm/algo-notes">GitHub 仓库</a></span>
    </div>
  </div>
</body>
</html>
